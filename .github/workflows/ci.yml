name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Ensure no private keys in bundle
        run: |
          if grep -rEl "PRIVATE_KEY|privateKeyToAccount" dist/; then echo "Secret-handling code found in client bundle" && exit 1; fi
